<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 타로 리딩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 AI 타로 리딩</h1>
            <p class="subtitle">당신의 고민을 타로 카드에 물어보세요</p>
        </header>

        <main>
            <section id="input-section">
                <form id="tarot-form">
                    <label for="concern">무엇이 고민인가요?</label>
                    <textarea
                        id="concern"
                        placeholder="예: 이직을 고민하고 있는데 지금이 적기일까요?"
                        maxlength="500"
                        rows="3"
                        required
                    ></textarea>
                    <div class="char-count"><span id="char-count">0</span>/500</div>
                    <button type="submit" id="submit-btn">카드 뽑기 🃏</button>
                </form>
            </section>

            <section id="loading-section" class="hidden">
                <div class="loading-cards">
                    <div class="card-back flip-1">🂠</div>
                    <div class="card-back flip-2">🂠</div>
                    <div class="card-back flip-3">🂠</div>
                </div>
                <p class="loading-text">카드를 섞고 있습니다...</p>
            </section>

            <section id="result-section" class="hidden">
                <div class="cards-display">
                    <div class="card-slot" id="card-past">
                        <div class="card-label">과거</div>
                        <div class="card-face"></div>
                        <div class="card-name"></div>
                        <div class="card-meaning"></div>
                    </div>
                    <div class="card-slot" id="card-present">
                        <div class="card-label">현재</div>
                        <div class="card-face"></div>
                        <div class="card-name"></div>
                        <div class="card-meaning"></div>
                    </div>
                    <div class="card-slot" id="card-future">
                        <div class="card-label">미래</div>
                        <div class="card-face"></div>
                        <div class="card-name"></div>
                        <div class="card-meaning"></div>
                    </div>
                </div>
                <div id="reading-text" class="reading-text"></div>
                <button id="retry-btn" class="retry-btn">다시 뽑기 🔄</button>
            </section>
        </main>

        <footer>
            <p>이 서비스는 오락 목적이며, 실제 점술과는 무관합니다.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
